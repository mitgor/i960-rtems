<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Doom on i960 — bounded frames</title>
<style>body{background:#101217;color:#eee;font:16px system-ui;max-width:960px;margin:32px auto;padding:0 20px}img{width:100%;height:auto;image-rendering:pixelated;background:#000}button{padding:12px;margin:12px 8px 12px 0}p{color:#c8cbd2}</style>
<h1>Doom on the Mylex i960</h1><p>Two bounded demo frames, rendered on the card. The opening wipe is skipped. This is a verified capture, not interactive gameplay.</p>
<img id="screen" width="640" height="400" alt="Captured Doom frame"><div><button id="prev">Previous frame</button><button id="next">Next frame</button><button id="refresh">Refresh capture</button></div><p id="status">Loading capture…</p><code id="hash"></code>
<script>let data,index=0;function show(){const f=data.frames[index];document.getElementById('screen').src=f.name;document.getElementById('status').textContent=`Frame ${index+1} of ${data.frames.length} · capture ${f.generation} · 320 × 200 · ${data.source}`;document.getElementById('hash').textContent='Frame + palette + padding SHA256: '+f.sha256;}async function load(){data=await(await fetch('frames.json',{cache:'no-store'})).json();index=0;show();}document.getElementById('prev').onclick=()=>{index=(index+data.frames.length-1)%data.frames.length;show()};document.getElementById('next').onclick=()=>{index=(index+1)%data.frames.length;show()};document.getElementById('refresh').onclick=load;load().catch(e=>document.getElementById('status').textContent=e.message);</script>
