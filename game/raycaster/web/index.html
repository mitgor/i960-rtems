<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Mylex raycaster</title><style>
body{margin:3em auto;padding:0 1em;max-width:850px;background:#10151c;color:#e6edf3;font:17px system-ui}canvas{width:100%;image-rendering:pixelated;background:#25394c;aspect-ratio:4/3;border:1px solid #43586b}button{padding:.6em 1em;color:inherit;background:#25374a;border:1px solid #526b85}#status{font:14px monospace}
</style><h1>Mylex raycaster</h1><p id="backend">Connecting…</p><canvas width="80" height="60" aria-label="Raycaster framebuffer"></canvas>
<p>↑/W forward · ↓/S backward · ←/A and →/D turn</p><button id="reset">Reset position</button><p id="status"></p><p>80 × 60 indexed pixels · fixed-point rays · bounded RTEMS callbacks</p>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),map={arrowup:1,w:1,arrowdown:2,s:2,arrowleft:4,a:4,arrowright:8,d:8},down=new Set();let reset=false;
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k in map){down.add(k);e.preventDefault();}});
addEventListener('keyup',e=>down.delete(e.key.toLowerCase()));addEventListener('blur',()=>down.clear());document.addEventListener('visibilitychange',()=>{if(document.hidden)down.clear();});
document.querySelector('#reset').onclick=()=>reset=true;
async function frame(){try{
 let keys=0;for(let k of down)keys|=map[k];let restart=reset;reset=false;
 const r=await fetch('/step',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keys:document.hidden?0:keys,reset:restart})});if(!r.ok)throw Error('HTTP '+r.status);
 const s=await r.json(),im=ctx.createImageData(80,60),palette=s.palette.map(c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16),255]);
 for(let i=0;i<4800;i++)im.data.set(palette[parseInt(s.frame.slice(i*2,i*2+2),16)],i*4);
 ctx.putImageData(im,0,0);document.querySelector('#backend').textContent=s.backend;
 document.querySelector('#status').textContent=`Frame ${s.frame_id} · position ${(s.x/1024).toFixed(2)}, ${(s.y/1024).toFixed(2)} · angle ${s.angle}/256 · ${s.dda_steps} grid steps · callback ${s.callback_ms.toFixed(1)} ms`;
 setTimeout(frame,16);
}catch(e){document.querySelector('#status').textContent='Stopped: '+e.message;}}
frame();</script></html>
